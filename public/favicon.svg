<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="3" fill="#0a0c14"/>
  <!-- knuckles: four raised blocks, W-shaped silhouette -->
  <rect x="3" y="3" width="2" height="3" fill="#e8e4d8"/>
  <rect x="6" y="2" width="2" height="4" fill="#f0a030"/>
  <rect x="9" y="2" width="2" height="4" fill="#f0a030"/>
  <rect x="12" y="3" width="2" height="3" fill="#e8e4d8"/>
  <!-- palm -->
  <rect x="3" y="6" width="11" height="6" fill="#f0a030"/>
  <!-- thumb -->
  <rect x="1" y="7" width="3" height="4" fill="#f0a030"/>
  <!-- brick knuckle gaps (ward / W valleys) -->
  <rect x="5" y="3" width="1" height="3" fill="#c43c3c"/>
  <rect x="8" y="2" width="1" height="4" fill="#c43c3c"/>
  <rect x="11" y="3" width="1" height="3" fill="#c43c3c"/>
  <!-- teal wrist wrap -->
  <rect x="4" y="12" width="9" height="2" fill="#3ad0c0"/>
</svg>
